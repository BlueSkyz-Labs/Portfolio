name: refresh dependency lock

on:
  push:
    branches: [fix/foundation-assurance]
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Refresh lockfile from package.json
        run: pnpm install --no-frozen-lockfile

      - name: Verify patched production dependency set
        run: pnpm audit --prod --audit-level=high

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
