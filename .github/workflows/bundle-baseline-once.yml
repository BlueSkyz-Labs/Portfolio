name: bundle-baseline-once

on:
  push:
    branches: [fix/foundation-assurance]

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Measure root-route gzip JS
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');

          const candidates = [
            '.next/server/app/index.html',
            '.next/server/app/page.html',
          ];
          const htmlPath = candidates.find(fs.existsSync);
          if (!htmlPath) {
            console.error('Root prerender HTML not found');
            console.error(fs.readdirSync('.next/server/app', { recursive: true }).filter(String));
            process.exit(1);
          }

          const html = fs.readFileSync(htmlPath, 'utf8');
          const urls = [...html.matchAll(/src=["']([^"']*\/_next\/static\/[^"']+\.js)["']/g)]
            .map((match) => match[1]);
          const unique = [...new Set(urls)];
          if (!unique.length) throw new Error('No initial-route JS scripts found in prerender HTML');

          const files = unique.map((url) => {
            const marker = '/_next/';
            const relative = url.slice(url.indexOf(marker) + marker.length);
            return path.join('.next', relative);
          });
          const measurements = files.map((file) => {
            const bytes = fs.readFileSync(file);
            return {
              file,
              rawBytes: bytes.length,
              gzipBytes: zlib.gzipSync(bytes, { level: 9 }).length,
            };
          });
          const result = {
            revision: process.env.GITHUB_SHA,
            htmlPath,
            rawBytes: measurements.reduce((sum, item) => sum + item.rawBytes, 0),
            gzipBytes: measurements.reduce((sum, item) => sum + item.gzipBytes, 0),
            files: measurements,
          };
          fs.writeFileSync('bundle-baseline.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: main-bundle-baseline
          path: bundle-baseline.json
          retention-days: 2
          if-no-files-found: error
