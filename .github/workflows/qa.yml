name: qa

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only is sufficient for checkout, exact-base fetches, caches, and artifacts.
permissions:
  contents: read

# Cancel in-flight runs on the same ref so we don't waste CI minutes on stale pushes.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact application/build runtime. First-party JavaScript actions are independently pinned below.
  NODE_VERSION: "24.20.0"
  PNPM_VERSION: "9.15.9"

jobs:
  qa:
    name: Quality Gates (architecture, lint, typecheck, build, e2e, a11y, perf)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm must exist before setup-node tries to resolve/cache the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      # ── Architecture regression gates ───────────────────────────────────
      - name: Architecture regressions
        run: pnpm test:architecture

      # ── Static gates (G1–G3) ────────────────────────────────────────────
      - name: Typecheck (G1)
        run: pnpm typecheck

      - name: Lint (G2)
        run: pnpm lint

      - name: Format check (G3)
        id: format-check
        run: |
          if pnpm format:check; then
            exit 0
          fi

          # Generate the deterministic Prettier correction as evidence so the
          # exact formatter version used by CI can be applied without hand edits.
          pnpm format
          git diff --name-only > /tmp/prettier-files.txt
          tar -czf prettier-output.tgz -T /tmp/prettier-files.txt
          exit 1

      - name: Upload Prettier correction
        if: failure() && steps.format-check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prettier-output
          path: prettier-output.tgz
          retention-days: 2
          if-no-files-found: error

      # ── Build + exact-base bundle regression (G4, G5) ──────────────────
      - name: Build candidate (G4)
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/candidate-next-build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Resolve exact bundle baseline revision
        id: bundle-base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No exact prior revision is available for G5" >&2
            exit 1
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build exact base revision for G5
        run: |
          BASE_SHA="${{ steps.bundle-base.outputs.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/bundle-base "$BASE_SHA"

          # Historical revisions before the workspace regression fix omitted
          # `packages`. Repair metadata only in this disposable worktree so
          # the source revision being measured remains otherwise unchanged.
          if [[ ! -f /tmp/bundle-base/pnpm-workspace.yaml ]]; then
            printf 'packages:\n  - "."\n' > /tmp/bundle-base/pnpm-workspace.yaml
          elif ! grep -q '^packages:' /tmp/bundle-base/pnpm-workspace.yaml; then
            { printf 'packages:\n  - "."\n'; cat /tmp/bundle-base/pnpm-workspace.yaml; } > /tmp/pnpm-workspace.yaml
            mv /tmp/pnpm-workspace.yaml /tmp/bundle-base/pnpm-workspace.yaml
          fi

          pnpm --dir /tmp/bundle-base install --frozen-lockfile
          set -o pipefail
          pnpm --dir /tmp/bundle-base build 2>&1 | tee /tmp/base-next-build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Bundle regression (G5)
        run: node scripts/check-bundle-regression.mjs /tmp/base-next-build.log /tmp/candidate-next-build.log

      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-evidence
          path: bundle-evidence.json
          retention-days: 7
          if-no-files-found: warn

      # ── E2E + A11y + Cross-browser (G6, G7, G11) ───────────────────────
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

      # ── Lighthouse (G8; G9 field INP remains a runtime/RUM gate) ────────
      - name: Lighthouse CI
        run: pnpm lighthouse
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true

  edge-smoke:
    name: Edge smoke (Chromium + Edge UA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # Cloudflare Pages is the deploy authority. Do not rebuild in Actions —
      # verify the live production host under an Edge user-agent instead.
      - name: Run smoke against Cloudflare production
        run: >-
          pnpm exec playwright test
          --project=edge-ua
          --reporter=line
          --grep "Smoke"
        env:
          PLAYWRIGHT_BASE_URL: https://portfolio.tonydemo.com
          NEXT_TELEMETRY_DISABLED: "1"
