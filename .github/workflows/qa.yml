name: qa

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs on the same ref so we don't waste CI minutes on stale pushes.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  qa:
    name: Quality Gates (architecture, lint, typecheck, build, e2e, a11y, perf)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must exist before setup-node tries to resolve/cache the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Architecture regression gate ─────────────────────────────────────
      - name: Layout ownership regression
        run: pnpm test:architecture

      # ── Static gates (G1–G3) ────────────────────────────────────────────
      - name: Typecheck (G1)
        run: pnpm typecheck

      - name: Lint (G2)
        run: pnpm lint

      - name: Format check (G3)
        id: format-check
        run: |
          if pnpm format:check; then
            exit 0
          fi

          # Generate the deterministic Prettier correction as evidence so the
          # exact formatter version used by CI can be applied without hand edits.
          pnpm format
          git diff --name-only > /tmp/prettier-files.txt
          tar -czf prettier-output.tgz -T /tmp/prettier-files.txt
          exit 1

      - name: Upload Prettier correction
        if: failure() && steps.format-check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: prettier-output.tgz
          retention-days: 2
          if-no-files-found: error

      # ── Build (G4, G5) ─────────────────────────────────────────────────
      - name: Build (G4)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # ── E2E + A11y + Cross-browser (G6, G7, G11) ───────────────────────
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      # ── Lighthouse (G8; G9 field INP remains a runtime/RUM gate) ────────
      - name: Lighthouse CI
        run: pnpm lighthouse
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn

  edge-smoke:
    name: Edge smoke (Chromium + Edge UA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Run smoke under Edge user-agent
        run: >-
          pnpm exec playwright test
          --project=edge-ua
          --reporter=line
          --grep "Smoke"
