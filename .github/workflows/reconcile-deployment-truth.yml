name: reconcile-deployment-truth

on:
  push:
    branches: [fix/foundation-assurance]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    name: Reconcile Pages deployment truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundation-assurance
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reconcile Product Truth and README
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path("SPEC.md")
          text = spec.read_text()
          old = '''- **Platform**: Cloudflare Pages
          - **Build command**: `pnpm build`
          - **Output**: OpenNext Cloudflare adapter → `.open-next/`
          - **Domain**: `portfolio.tonydemo.com` (CNAME)
          - **Branch**: `main` is production, `develop` is preview
          - **Env vars**: managed in Cloudflare dashboard, mirrored in `.env.example`'''
          new = '''- **Platform**: Cloudflare Pages
          - **Build command**: `pnpm build`
          - **Rendering model**: Next.js static export (`output: "export"`)
          - **Output**: `out/`
          - **Domain**: `portfolio.tonydemo.com` (CNAME)
          - **Branch**: `main` is production; non-production branches/PRs use Pages previews
          - **Env vars**: managed in Cloudflare dashboard, mirrored in `.env.example`'''
          if old not in text:
              raise SystemExit("expected SPEC deployment contract not found")
          spec.write_text(text.replace(old, new, 1))

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace("├── cloudflare-pages.toml", "├── wrangler.toml")
          old = '''Cloudflare Pages — automatic on push to `main`.

          1. Connect this repo to a Cloudflare Pages project
          2. Build command: `pnpm install --frozen-lockfile && pnpm build`
          3. Build output: `.next`
          4. Add the custom domain `portfolio.tonydemo.com` in the Cloudflare dashboard

          The `cloudflare-pages.toml` file at the root carries the headers / redirects / cache rules.'''
          new = '''Cloudflare Pages — static Next.js export, automatic through the connected Pages project.

          1. Connect this repo to the `blueskyz-labs-portfolio` Cloudflare Pages project
          2. Build command: `pnpm install --frozen-lockfile && pnpm build`
          3. Build output: `out`
          4. Production branch: `main`; other branches and pull requests use Pages preview deployments
          5. Add the custom domain `portfolio.tonydemo.com` in the Cloudflare dashboard

          `wrangler.toml` declares the Pages project and build output. `public/_headers` carries the static security and cache headers that ship with the exported artifact.'''
          if old not in text:
              raise SystemExit("expected README deployment section not found")
          readme.write_text(text.replace(old, new, 1))
          PY

      - name: Deterministic docs formatting
        run: pnpm exec prettier --write SPEC.md README.md

      - name: Deployment contract regression
        run: pnpm test:architecture

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md README.md
          git diff --cached --exit-code && { echo "No reconciliation changes"; exit 1; } || true
          git commit -m "docs(deploy): align Product Truth with Cloudflare Pages static export"
          git push origin HEAD:fix/foundation-assurance
