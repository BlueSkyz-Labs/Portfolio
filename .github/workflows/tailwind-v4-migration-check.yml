name: tailwind-v4-stacked-verify

on:
  push:
    branches: [chore/tailwind-v4-convergence]

permissions:
  contents: read

concurrency:
  group: tailwind-v4-stacked-verify
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"
  UPSTREAM_SHA: "d83a43ce49e6a743f3226e380b9e17843644570f"

jobs:
  verify:
    name: Tailwind v4 full stacked verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout actual PR #3 landing candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/3/merge
          fetch-depth: 0

      - name: Record landing candidate
        run: git log -1 --format='landing_candidate=%H'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Architecture regressions
        run: pnpm test:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build candidate static export
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/candidate-next-build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build exact upstream revision for G5
        run: |
          git worktree add --detach /tmp/tailwind-upstream "$UPSTREAM_SHA"
          pnpm --dir /tmp/tailwind-upstream install --frozen-lockfile
          set -o pipefail
          pnpm --dir /tmp/tailwind-upstream build 2>&1 | tee /tmp/base-next-build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Bundle regression G5
        run: node scripts/check-bundle-regression.mjs /tmp/base-next-build.log /tmp/candidate-next-build.log

      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-v4-bundle-evidence
          path: bundle-evidence.json
          retention-days: 7
          if-no-files-found: warn

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium firefox webkit

      - name: Cross-browser E2E and axe
        run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Edge-UA smoke
        run: >-
          pnpm exec playwright test
          --project=edge-ua
          --reporter=line
          --grep "Smoke"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-v4-playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Lighthouse CI
        run: pnpm lighthouse
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-v4-lighthouse-evidence
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
