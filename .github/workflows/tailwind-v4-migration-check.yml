name: tailwind-v4-migration-check

on:
  push:
    branches: [chore/tailwind-v4-convergence]

permissions:
  contents: read

jobs:
  contract:
    name: Tailwind v4 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:architecture
