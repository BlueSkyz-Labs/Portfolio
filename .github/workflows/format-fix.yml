name: format-fix

on:
  push:
    branches: [fix/foundation-assurance]

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  format:
    name: Apply locked Prettier baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/foundation-assurance

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        run: pnpm format

      - name: Commit deterministic formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply locked Prettier baseline"
          git push origin HEAD:fix/foundation-assurance
