name: perf-candidate-verify

on:
  push:
    branches: [perf/initial-js-budget]

permissions:
  contents: read

jobs:
  verify:
    name: Verify initial JS budget candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Architecture and static gates
        run: |
          pnpm test:architecture
          pnpm typecheck
          pnpm lint
          pnpm format:check

      - name: Build candidate
        run: |
          set -o pipefail
          NEXT_TELEMETRY_DISABLED=1 pnpm build 2>&1 | tee /tmp/perf-candidate-build.log

      - name: Measure exported home-page JavaScript
        run: |
          python - <<'PY'
          import gzip
          import json
          import re
          from pathlib import Path

          html = Path("out/index.html").read_text()
          sources = sorted(set(re.findall(r'<script[^>]+src="([^"]+\.js)"', html)))
          files = []
          total_raw = 0
          total_gzip = 0
          for src in sources:
              local = Path("out") / src.lstrip("/")
              if not local.exists():
                  raise SystemExit(f"referenced JS asset missing: {src}")
              data = local.read_bytes()
              gzip_bytes = len(gzip.compress(data, compresslevel=9, mtime=0))
              raw_bytes = len(data)
              files.append({"src": src, "rawBytes": raw_bytes, "gzipBytes": gzip_bytes})
              total_raw += raw_bytes
              total_gzip += gzip_bytes

          evidence = {
              "referencedScriptCount": len(files),
              "totalRawBytes": total_raw,
              "totalGzipBytes": total_gzip,
              "files": files,
          }
          Path("perf-network-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Build exact production base
        run: |
          git worktree add --detach /tmp/perf-base 5dadb214a2d62a5b9f131a5cdbc87325a5545f64
          pnpm --dir /tmp/perf-base install --frozen-lockfile
          set -o pipefail
          NEXT_TELEMETRY_DISABLED=1 pnpm --dir /tmp/perf-base build 2>&1 | tee /tmp/perf-base-build.log

      - name: G5 and absolute Product Truth budget
        run: node scripts/check-bundle-regression.mjs /tmp/perf-base-build.log /tmp/perf-candidate-build.log

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-candidate-evidence
          path: |
            perf-network-evidence.json
            bundle-evidence.json
          retention-days: 7
          if-no-files-found: warn
