name: refresh-eslint-lockfile

on:
  push:
    branches:
      - chore/eslint-cli-migration

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/eslint-cli-migration
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile from package manifest
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Remove one-shot workflow and commit generated lockfile
        run: |
          rm .github/workflows/refresh-lockfile-eslint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/refresh-lockfile-eslint.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "chore(tooling): refresh lockfile for ESLint CLI"
          git push origin HEAD:chore/eslint-cli-migration
