name: qa-deps-fix

on:
  push:
    branches: [fix/foundation-assurance]

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  lock:
    name: Pin browser QA dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/foundation-assurance

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install locked baseline
        run: pnpm install --frozen-lockfile

      - name: Add exact QA dependencies
        run: >-
          pnpm add -D --save-exact
          @playwright/test@1.62.1
          @axe-core/playwright@4.13.0
          @lhci/cli@0.15.1

      - name: Commit package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "test(qa): pin Playwright axe and Lighthouse CI"
          git push origin HEAD:fix/foundation-assurance
