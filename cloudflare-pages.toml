# =============================================================================
# Cloudflare Pages configuration
# =============================================================================
# https://developers.cloudflare.com/pages/configuration/
# =============================================================================

name = "portfolio"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ─── Production build ────────────────────────────────────────────────────────
[build]
command = "pnpm install --frozen-lockfile && pnpm build"
directory = ".next"

# ─── Environment variables (non-secret) ──────────────────────────────────────
[env]
NEXT_PUBLIC_SITE_URL = "https://portfolio.tonydemo.com"
NEXT_PUBLIC_SITE_NAME = "BlueSkyz Labs"

# ─── Custom domain ──────────────────────────────────────────────────────────
# Configure the domain `portfolio.tonydemo.com` in the Cloudflare dashboard.
# CNAME record: portfolio.tonydemo.com → <project>.pages.dev

# ─── Headers (security + performance) ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Long-cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache, must-revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─── Redirects ──────────────────────────────────────────────────────────────
# www → apex
[[redirects]]
  from = "https://www.portfolio.tonydemo.com/*"
  to = "https://portfolio.tonydemo.com/:splat"
  status = 301
